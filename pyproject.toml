[project]
name = "new_video_pip"
version = "0.1.0"
description = "Video generation and education pipeline workspace"
requires-python = ">=3.10,<3.15"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages", "packages/model_testing"]
