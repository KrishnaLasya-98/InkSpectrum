[project]
name = "model-evaluator"
version = "0.1.0"
description = "LLM model testing harness for Phase 0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
model-eval = "model_evaluator.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["model_evaluator*"]
